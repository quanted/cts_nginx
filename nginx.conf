upstream cts_django {
    server cts-django:8080;  # TODO: use host-level
}

upstream cts_pkasolver_flask {
    server cts-pkasolver:8080;
}

upstream cts_molgpka_flask {
    server cts-molgpka:8080;
}

# ---- New CTS stack (Shiny dashboard + Flask API), alongside Django ------------
#   /cts/shiny/        -> cts-shiny (dashboard; HTTP + websocket)
#   /cts/shiny/rest/   -> cts-api   (Flask API; run it with CTS_API_URL_PREFIX=/cts/shiny/rest)
#   everything else under /cts stays with Django (^~ keeps /cts/shiny/ away from it)
# The dashboard calls the API directly inside the cluster
# (CTS_API_URL=http://cts-api:5000/cts/shiny/rest), not through this proxy.

upstream cts_shiny {
    server cts-shiny:8000;
    # One replica for now: a Shiny session lives in one process. With several
    # replicas, requests outside the session's websocket (file uploads and
    # downloads, coming with batch mode) need sticky routing.
}

upstream cts_flask_api {
    server cts-api:5000;
    keepalive 16;
}

# Websocket upgrade for Shiny ("close" for ordinary requests)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Outside callers of the new API's calculation endpoints: 30 requests/minute per
# client IP, bursts of 20 (OPERA and the metabolizer can run for minutes).
limit_req_zone $binary_remote_addr zone=cts_flask_api_runs:10m rate=30r/m;
limit_req_status 429;
# --------------------------------------------------------------------------------

# cts django backend
server {
    listen 80;
	server_name qed.epa.gov qed.qed-stage.aws.epa.gov qed.qed-prod.aws.epa.gov;

    if ($request_method ~ ^(TRACE)$ ) {
        return 405;
    }

    client_max_body_size 200M;
    client_body_buffer_size 200M;

    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, DELETE';
	add_header Access-Control-Max-Age 600;

    # HSTS Policy (max-age=60 == 1 min. 31536000 = 1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options nosniff;

    server_tokens off;

    # Route for old static files
    location /cts/static_qed/ {
        alias /src/collected_static/;
    }

    location /cts/static/ {
        alias /src/collected_static/;
    }

    location / {
        try_files $uri @cts_django;
    }

    location @cts_django {
        include uwsgi_params;
        uwsgi_pass cts_django;
        proxy_read_timeout 1200;
        proxy_send_timeout 1200;
        uwsgi_read_timeout 1200s;
        uwsgi_send_timeout 1200s;
	    proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # HSTS Policy (max-age=60 == 1 min), 31536000 = 1 year Unknown if proxy_set_header disables inheritance like add_header
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # nodejs/socket.io route:
    location /cts/ws/ {
        
        proxy_connect_timeout       300;
        proxy_send_timeout          300;
        proxy_read_timeout          90m;
        send_timeout                300;
        

        proxy_pass          http://cts-nodejs:4000;  # TODO: use host-level
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection 'upgrade';
        proxy_set_header    Host $host;
    }

    # ---- New CTS Flask API (Swagger UI at /cts/shiny/rest/) -------------------
    # No add_header here, so the server-level CORS and security headers above
    # still apply (a location with its own add_header would drop them).
    location ^~ /cts/shiny/rest/ {
        proxy_pass http://cts_flask_api;    # no URI: the API runs at /cts/shiny/rest
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;           # OPERA can take up to ~15 minutes

        # Requests that start calculator jobs are rate limited per client IP.
        location ~ ^/cts/shiny/rest/(v2/pchem|v2/transformation-products|[a-z]+/run|molecule)/?$ {
            limit_req zone=cts_flask_api_runs burst=20 nodelay;
            proxy_pass http://cts_flask_api;
        }
    }

    # ---- New CTS dashboard (Shiny) -------------------------------------------
    location = /cts/shiny {
        return 301 /cts/shiny/;
    }

    # The longest matching prefix wins, so /cts/shiny/... never reaches Django's
    # "location /"; ^~ also keeps any regex location from taking these requests.
    location ^~ /cts/shiny/ {
        proxy_pass http://cts_shiny/;       # trailing "/" strips /cts/shiny/ (the app runs at /)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # A dashboard session is one long websocket; keep idle sessions connected.
        proxy_connect_timeout 10s;
        proxy_send_timeout 90m;
        proxy_read_timeout 90m;
        proxy_buffering off;
    }
    # --------------------------------------------------------------------------

    location /molgpka {
        include /etc/nginx/uwsgi_params;
        uwsgi_pass cts_molgpka_flask;
        proxy_read_timeout 1200;
        proxy_send_timeout 1200;
        uwsgi_read_timeout 1200s;
        uwsgi_send_timeout 1200s;
    }

    location /pkasolver {
        include /etc/nginx/uwsgi_params;
        uwsgi_pass cts_pkasolver_flask;
        proxy_read_timeout 1200;
        proxy_send_timeout 1200;
        uwsgi_read_timeout 1200s;
        uwsgi_send_timeout 1200s;
    }

    # location /epi/api/submit {
    #     proxy_pass http://cts-epi:8080/api/submit;
    # }

    # Proxy for ctsws endpoint:
    # location /ctsws/rest/isvalidchemical {
    #     proxy_pass http://cts-ctsws:8080/ctsws/rest/isvalidchemical;
    # }
	
}
